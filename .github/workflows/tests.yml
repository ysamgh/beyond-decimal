name: Tests

on:
  push:
    branches: ["main", "research/**", "feature/**"]
  pull_request:
    branches: ["main", "research/**"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package and test dependencies
        run: python -m pip install -e ".[dev,mcp]"
      - name: Verify MCP server imports
        run: python -c "from beyond_decimal.arxiv.mcp_server import mcp; assert mcp is not None"
      - name: Run tests
        run: python -m pytest
